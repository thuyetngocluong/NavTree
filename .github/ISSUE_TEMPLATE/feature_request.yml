name: Feature request
description: Suggest an API or behavior for NavTree
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the navigation flow you can't express (or can't express cleanly) today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      render: swift
